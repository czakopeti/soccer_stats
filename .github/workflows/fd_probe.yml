# Temporary probe branch. Runs only on pushes to this branch.
name: probe
on:
  push:
    branches: [fd-probe]
    paths: [".github/workflows/fd_probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="PL-Xray/1.0 (+https://github.com/czakopeti/soccer_stats)"
          for c in ENG ESP DEU ITA FRA; do curl -sL -m 60 -A "$UA" -o probe/ef_$c.html -w "$c %{http_code} %{size_download}\n" "https://elofootball.com/country.php?countryiso=$c&season=2026-2027"; sleep 3; done | tee probe/ef2_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe output" && git push
