# Temporary probe branch. Runs only on pushes to this branch.
name: probe
on:
  push:
    branches: [fd-probe]
    paths: [".github/workflows/fd_probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="PL-Xray/1.0 (+https://github.com/czakopeti/soccer_stats)"
          curl -s -A "$UA" -o probe/live9.json -w "live %{http_code} %{size_download}\n" "https://fantasy.premierleague.com/api/event/9/live/" | tee probe/fpl_log.txt
          curl -s -A "$UA" -o probe/fixtures9.json -w "fix %{http_code} %{size_download}\n" "https://fantasy.premierleague.com/api/fixtures/?event=9" | tee -a probe/fpl_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe output" && git push
