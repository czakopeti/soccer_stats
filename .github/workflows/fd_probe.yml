# Temporary probe branch. Runs only on pushes to this branch.
name: probe
on:
  push:
    branches: [fd-probe]
    paths: [".github/workflows/fd_probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="PL-Xray/1.0 (+https://github.com/czakopeti/soccer_stats)"
          for u in "http://api.clubelo.com/2026-11-07:elo_day.csv" "http://api.clubelo.com/Fixtures:elo_fixtures.csv" "http://api.clubelo.com/ManCity:elo_mancity.csv" "https://elofootball.com/:elofootball.html"; do url="${u%:*}"; f="${u##*:}"; curl -sL -m 60 -A "$UA" -o probe/$f -w "$f %{http_code} %{size_download}\n" "$url"; done | tee probe/elo_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe output" && git push
