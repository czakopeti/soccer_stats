# Temporary probe branch. Runs only on pushes to this branch.
name: probe
on:
  push:
    branches: [fd-probe]
    paths: [".github/workflows/fd_probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="PL-Xray/1.0 (+https://github.com/czakopeti/soccer_stats)"
          curl -s --compressed -A "$UA" -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://understat.com/league/EPL/2026" -o probe/epl.json -w "epl %{http_code} %{size_download}\n" "https://understat.com/getLeagueData/EPL/2026" | tee probe/epl_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe output" && git push
