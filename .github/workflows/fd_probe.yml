# Temporary: download this season's football-data.co.uk files for four leagues. Runs only on this branch.
name: football-data probe
on:
  push:
    branches: [fd-probe]
    paths: [".github/workflows/fd_probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          for D in SP1 D1 I1 F1; do curl -sL -A "PL-Xray/1.0 (+https://github.com/czakopeti/soccer_stats)" -o probe/$D.csv -w "$D %{http_code} %{size_download}\n" "https://www.football-data.co.uk/mmz4281/2627/$D.csv" | tee -a probe/log.txt; done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe output" && git push
