# Temporary probe branch. Runs only on pushes to this branch.
name: probe
on:
  push:
    branches: [fd-probe]
    paths: [".github/workflows/fd_probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          curl -sL -A "PL-Xray/1.0 (+https://github.com/czakopeti/soccer_stats)" -o probe/fixtures.csv -w "fixtures %{http_code} %{size_download}\n" "https://www.football-data.co.uk/fixtures.csv" | tee probe/fx_log.txt
          for d in E0 SP1 D1 I1 F1; do curl -sL -A "PL-Xray/1.0 (+https://github.com/czakopeti/soccer_stats)" -o probe/$d.csv -w "$d %{http_code} %{size_download}\n" "https://www.football-data.co.uk/mmz4281/2627/$d.csv"; done | tee probe/e0_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe output" && git push
